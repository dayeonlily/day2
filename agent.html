<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>제주 특산물 에이전트</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; height: 100vh; display: flex; flex-direction: column; font-family: sans-serif; background: #fff3e0; color: #333; }
    header { padding: 1rem; text-align: center; color: #fff; background: linear-gradient(135deg, #ff9800, #ef6c00); }
    header h1 { margin: 0; font-size: 1.2rem; }
    header p { margin: .2rem 0 0; font-size: .8rem; opacity: .9; }
    #chat { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: .6rem; }
    .msg { max-width: 75%; padding: .6rem .9rem; border-radius: 16px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
    .me { align-self: flex-end; background: #ff9800; color: #fff; border-bottom-right-radius: 4px; }
    .bot { align-self: flex-start; background: #fff; border-bottom-left-radius: 4px; box-shadow: 0 1px 4px rgba(0,0,0,.12); }
    form { display: flex; gap: .5rem; padding: .75rem 1rem; background: #fff; border-top: 1px solid #ffe0b2; }
    input { flex: 1; padding: .65rem .9rem; font-size: 1rem; border: 1px solid #ccc; border-radius: 999px; outline: none; }
    input:focus { border-color: #ef6c00; }
    button { padding: .65rem 1.2rem; font-size: 1rem; border: 0; border-radius: 999px; background: #ef6c00; color: #fff; cursor: pointer; }
    .note { padding: .35rem; text-align: center; font-size: .7rem; color: #999; background: #fff; }
  </style>
</head>
<body>
  <header>
    <h1>🍊 제주 특산물 에이전트</h1>
    <p>제주도 특산물에 대해 물어보세요</p>
  </header>

  <div id="chat">
    <div class="msg bot">안녕하세요! 저는 제주 특산물을 알려드리는 에이전트예요 🍊 무엇이 궁금하세요?</div>
  </div>

  <form id="form">
    <input id="input" type="text" placeholder="메시지를 입력하세요" autocomplete="off">
    <button type="submit">보내기</button>
  </form>
  <div class="note">※ 지금 답변은 연습용 가짜 답이에요.</div>

  <script>
    const chat = document.getElementById('chat');
    const input = document.getElementById('input');
    const replies = [
      '안녕하세요! 제주 특산물이 궁금하시군요 🍊 감귤, 흑돼지, 해산물 중에 어떤 게 궁금하세요?',
      '겨울이라면 한라봉을 추천해요! 달콤하고 향이 좋아서 선물로도 인기가 많아요 🍊',
      '아직 공부 중이에요! 5일차에 진짜로 알아볼게요.'
    ];
    let turn = 0;

    function add(text, who) {
      const d = document.createElement('div');
      d.className = 'msg ' + who;
      d.textContent = text;
      chat.appendChild(d);
      chat.scrollTop = chat.scrollHeight;
    }

    document.getElementById('form').addEventListener('submit', e => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      add(text, 'me');
      input.value = '';
      const reply = replies[turn % replies.length];
      turn++;
      setTimeout(() => add(reply, 'bot'), 1000);
    });
  </script>
</body>
</html>
