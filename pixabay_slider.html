<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixabay 이미지 슬라이더</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 1rem; font-family: sans-serif; background: #f4f6f8; color: #333; }
    .wrap { max-width: 720px; margin: 0 auto; }
    h1 { font-size: 1.4rem; }
    form { display: flex; flex-direction: column; gap: .5rem; margin-bottom: 1rem; }
    .row { display: flex; gap: .5rem; }
    input { flex: 1; padding: .6rem .8rem; font-size: 1rem; border: 1px solid #bbb; border-radius: 8px; }
    button { padding: .6rem 1rem; font-size: 1rem; border: 0; border-radius: 8px; background: #2e7d32; color: #fff; cursor: pointer; }
    button:disabled { background: #aaa; cursor: default; }
    #msg { min-height: 1.5rem; color: #c62828; font-size: .9rem; }
    .slider { position: relative; background: #000; border-radius: 12px; overflow: hidden; display: none; }
    .slider img { display: block; width: 100%; height: 420px; object-fit: contain; }
    .nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,.5); font-size: 1.4rem; padding: .5rem .9rem; }
    .prev { left: .5rem; } .next { right: .5rem; }
    .info { display: flex; justify-content: space-between; padding: .5rem .8rem; background: #222; color: #ddd; font-size: .85rem; }
    .info a { color: #9ccc65; }
    .thumbs { display: flex; gap: .4rem; overflow-x: auto; padding: .5rem 0; }
    .thumbs img { width: 64px; height: 48px; object-fit: cover; border-radius: 6px; cursor: pointer; opacity: .6; }
    .thumbs img.on { opacity: 1; outline: 2px solid #2e7d32; }
  </style>
</head>
<body>
<div class="wrap">
  <h1>🖼️ Pixabay 이미지 슬라이더</h1>

  <form id="form">
    <div class="row">
      <input id="key" type="password" placeholder="Pixabay API Key" autocomplete="off">
    </div>
    <div class="row">
      <input id="q" type="text" placeholder="검색어 (예: jeju, tangerine)" required>
      <button id="go" type="submit">검색</button>
    </div>
  </form>
  <div id="msg"></div>

  <div class="slider" id="slider">
    <img id="main" alt="">
    <button type="button" class="nav prev" id="prev">‹</button>
    <button type="button" class="nav next" id="next">›</button>
    <div class="info"><span id="count"></span><span id="credit"></span></div>
  </div>
  <div class="thumbs" id="thumbs"></div>
</div>

<script>
  const $ = id => document.getElementById(id);
  let images = [], idx = 0;

  // API 키는 내 브라우저(localStorage)에만 저장됩니다. 코드에 직접 적지 마세요.
  try { $('key').value = localStorage.getItem('pixabay_key') || ''; } catch (e) {}

  $('form').addEventListener('submit', async e => {
    e.preventDefault();
    const key = $('key').value.trim(), q = $('q').value.trim();
    if (!key) { $('msg').textContent = 'API Key를 입력하세요.'; return; }
    try { localStorage.setItem('pixabay_key', key); } catch (e) {}
    $('msg').textContent = '불러오는 중...';
    $('go').disabled = true;
    try {
      const url = 'https://pixabay.com/api/?key=' + encodeURIComponent(key) +
        '&q=' + encodeURIComponent(q) + '&image_type=photo&per_page=10&safesearch=true&lang=ko';
      const res = await fetch(url);
      if (!res.ok) throw new Error(res.status === 400 ? 'API Key가 올바르지 않습니다.' : '요청 실패 (' + res.status + ')');
      const data = await res.json();
      images = data.hits;
      if (!images.length) { $('msg').textContent = '검색 결과가 없습니다.'; $('slider').style.display = 'none'; $('thumbs').innerHTML = ''; return; }
      $('msg').textContent = '';
      idx = 0;
      buildThumbs();
      show();
    } catch (err) {
      $('msg').textContent = err.message;
    } finally {
      $('go').disabled = false;
    }
  });

  function buildThumbs() {
    $('thumbs').innerHTML = '';
    images.forEach((im, i) => {
      const t = document.createElement('img');
      t.src = im.previewURL; t.alt = im.tags;
      t.addEventListener('click', () => { idx = i; show(); });
      $('thumbs').appendChild(t);
    });
  }

  function show() {
    const im = images[idx];
    $('slider').style.display = 'block';
    $('main').src = im.webformatURL;
    $('main').alt = im.tags;
    $('count').textContent = (idx + 1) + ' / ' + images.length;
    $('credit').innerHTML = 'by <a href="' + im.pageURL + '" target="_blank" rel="noopener">' + im.user + '</a> · Pixabay';
    [...$('thumbs').children].forEach((t, i) => t.classList.toggle('on', i === idx));
  }

  const move = d => { if (images.length) { idx = (idx + d + images.length) % images.length; show(); } };
  $('prev').addEventListener('click', () => move(-1));
  $('next').addEventListener('click', () => move(1));
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    if (e.key === 'ArrowLeft') move(-1);
    if (e.key === 'ArrowRight') move(1);
  });
</script>
</body>
</html>
